<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Robot Camera</title>
<link rel="manifest" href="manifest.json" />
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #preview { width: 100%; height: 100%; object-fit: cover; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 10px 14px; font: 14px system-ui, sans-serif; color: #fff;
    background: linear-gradient(rgba(0,0,0,0.55), transparent);
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none;
  }
  #status { display: flex; align-items: center; gap: 6px; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: #e33; }
  #dot.live { background: #2ecc71; }
  #stats { opacity: 0.8; }
</style>
</head>
<body>
  <video id="preview" autoplay playsinline muted></video>
  <div id="hud">
    <div id="status"><span id="dot"></span><span id="statusText">connecting...</span></div>
    <div id="stats"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
